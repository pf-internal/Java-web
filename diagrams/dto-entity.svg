<svg xmlns="http://www.w3.org/2000/svg" width="620" height="220" viewBox="0 0 620 220" font-family="'Helvetica Neue', Arial, Meiryo, sans-serif">

  <!-- 背景 -->
  <rect width="620" height="220" fill="#ffffff" rx="8"/>

  <!-- === 左ボックス: DB（Entity） === -->
  <rect x="20" y="20" width="200" height="178" rx="8" fill="#f0f8ff" stroke="#0033ff" stroke-width="2"/>
  <!-- ヘッダ行 -->
  <rect x="20" y="20" width="200" height="34" rx="8" fill="#0033ff"/>
  <rect x="20" y="40" width="200" height="14" fill="#0033ff"/>
  <text x="120" y="42" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">DB（テーブル）</text>
  <!-- テーブル名 -->
  <text x="120" y="74" text-anchor="middle" fill="#0033ff" font-size="12" font-style="italic">sales_table</text>
  <line x1="30" y1="80" x2="210" y2="80" stroke="#c0d8f0" stroke-width="1"/>
  <!-- 列 -->
  <text x="40" y="100" fill="#333" font-size="12">id</text>
  <text x="130" y="100" fill="#888" font-size="11" font-style="italic">INT (PK)</text>
  <text x="40" y="120" fill="#333" font-size="12">sale_date</text>
  <text x="130" y="120" fill="#888" font-size="11" font-style="italic">DATE</text>
  <text x="40" y="140" fill="#333" font-size="12">amount</text>
  <text x="130" y="140" fill="#888" font-size="11" font-style="italic">INT</text>
  <text x="40" y="160" fill="#333" font-size="12">shop_id</text>
  <text x="130" y="160" fill="#888" font-size="11" font-style="italic">INT (FK)</text>
  <!-- Entityラベル -->
  <rect x="35" y="175" width="168" height="18" rx="4" fill="#e8f4ff" stroke="#0033ff" stroke-width="1"/>
  <text x="119" y="188" text-anchor="middle" fill="#0033ff" font-size="11" font-weight="bold">Entity（列とほぼ1対1）</text>

  <!-- === 矢印 === -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#cc0000"/>
    </marker>
  </defs>
  <line x1="225" y1="109" x2="385" y2="109" stroke="#cc0000" stroke-width="2.5" marker-end="url(#arrowhead)"/>
  <!-- DTOラベル（矢印上） -->
  <rect x="256" y="88" width="72" height="22" rx="4" fill="#fff5e6" stroke="#cc0000" stroke-width="1.5"/>
  <text x="292" y="103" text-anchor="middle" fill="#cc0000" font-size="12" font-weight="bold">→ DTO →</text>
  <!-- 「必要な項目だけ選んで変換」 -->
  <text x="292" y="130" text-anchor="middle" fill="#888" font-size="10">必要な項目だけ選んで変換</text>

  <!-- === 右ボックス: アプリ（DTO） === -->
  <rect x="395" y="20" width="210" height="178" rx="8" fill="#fff5e6" stroke="#cc0000" stroke-width="2"/>
  <!-- ヘッダ行 -->
  <rect x="395" y="20" width="210" height="34" rx="8" fill="#cc0000"/>
  <rect x="395" y="40" width="210" height="14" fill="#cc0000"/>
  <text x="500" y="42" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">アプリ（画面・処理）</text>
  <!-- クラス名 -->
  <text x="500" y="74" text-anchor="middle" fill="#cc0000" font-size="12" font-style="italic">SalesSummaryDto</text>
  <line x1="405" y1="80" x2="595" y2="80" stroke="#f0d0c0" stroke-width="1"/>
  <!-- フィールド -->
  <text x="415" y="100" fill="#333" font-size="12">totalAmount</text>
  <text x="415" y="120" fill="#333" font-size="12">displayDate</text>
  <text x="415" y="140" fill="#333" font-size="12">shopName</text>
  <text x="415" y="160" fill="#888" font-size="12" font-style="italic">…（必要な形に編集）</text>
  <!-- DTOラベル -->
  <rect x="410" y="175" width="178" height="18" rx="4" fill="#ffe5cc" stroke="#cc0000" stroke-width="1"/>
  <text x="499" y="188" text-anchor="middle" fill="#cc0000" font-size="11" font-weight="bold">DTO（使いやすい形に詰め替え）</text>

</svg>
